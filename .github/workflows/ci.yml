name: CI

permissions:
  actions: write
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.stdlib }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: config-v1
          compiler-cache-scope: ${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          buildmaster-cache-key: bm-config-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: false
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    name: macos-arm64
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang
          compiler-cache-key: config-v1
          buildmaster-cache-key: bm-config-macos-clang
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: false
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    name: windows-clang-cl

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: config-v1
          buildmaster-cache-key: bm-config-windows-clang-cl
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: false
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test
